# ================ move keytable ===========================
# prefix g enters the move table (explicit; tmux 3.8 also binds this by default)
bind g switch-client -T move

# h/j/k/l nudge the floating pane (-r: keep tapping within repeat-time)
bind -r -T move h move-pane -L 1
bind -r -T move j move-pane -D 1
bind -r -T move k move-pane -U 1
bind -r -T move l move-pane -R 1

# H/J/K/L/= snap the floating pane to a position
bind -T move H move-pane -P centre-left
bind -T move J move-pane -P bottom-centre
bind -T move K move-pane -P top-centre
bind -T move L move-pane -P centre-right
bind -T move = move-pane -P centre
