# ================ move keytable ===========================
# prefix g enters the move table (explicit; tmux 3.8 also binds this by default)
bind g switch-client -T move

# alt-h/j/k/l nudge the floating pane (-r: keep tapping within repeat-time)
bind -r -T move M-h move-pane -L 1
bind -r -T move M-j move-pane -D 1
bind -r -T move M-k move-pane -U 1
bind -r -T move M-l move-pane -R 1

# h/j/k/l snap to an edge, keeping the other axis (-X/-Y is the border cell: size - pane - 2 borders)
# j leaves a 1 row gap at the bottom; c centres the pane
bind -r -T move h move-pane -X 0
bind -r -T move j run-shell -C 'move-pane -Y #{e|-:#{e|-:#{window_height},#{pane_height}},3}'
bind -r -T move k move-pane -Y 0
bind -r -T move l run-shell -C 'move-pane -X #{e|-:#{e|-:#{window_width},#{pane_width}},2}'
bind -r -T move c move-pane -P centre
