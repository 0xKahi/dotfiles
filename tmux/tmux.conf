source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-shell /bin/zsh

set -g default-terminal "tmux-256color"

set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g prefix ^B
set -g renumber-windows on       # renumber all windows when any window is closed
set -g allow-passthrough all     # Allow programs in the pane to bypass tmux
set -g set-clipboard on          # use system clipboard
set -g mouse on                  # enable mouse support
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g escape-time 0            # remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000     # increase history size (from 2,000)
set -g status-position top       # macOS / darwin style
set -g pane-border-lines simple  # simple dotted lines for pane borders
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g mode-keys vi
set -g copy-mode-line-numbers hybrid
set -g copy-mode-line-number-style 'fg=#545e8a'
set -g copy-mode-current-line-number-style 'fg=#72F6B2,bold'
#set -g detach-on-destroy off     # don't exit from tmux when closing a session
#set -g default-terminal "${TERM}"

## not to sure how this works gotta check it out
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Plugins ( plugin manager: tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'omerxx/tmux-sessionx' 
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-cpu'

## float x
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#D498F8'
set -g @floax-text-color '#c8d3f5'
set -g @floax-bind 'p'
set -g @floax-change-path 'false'
## Session Manager
set -g @sessionx-auto-accept 'off'
# set -g @sessionx-custom-paths '/Users/kahi/dotfiles'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '75%'
set -g @sessionx-bind 'o'

set -g @sessionx-bind-kill-session 'alt-x'
set -g @sessionx-bind-select-up 'alt-k'
set -g @sessionx-bind-select-down 'alt-j'
set -g @sessionx-filter-current 'false'
set -g @sessionx-additional-options "--color border:#00FF9C,label:#72F6B2,header:#95C9F8,bg+:#311b92"

## tmux-thumbs
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-regexp-1 'git push[^\n;|&]*' # Match git push commands
bind-key -T copy-mode-vi 'space' thumbs-pick

## tmux-yank
set -g @yank_with_mouse off # disable default yank exit when using mouse 
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default

## Catppuccin theme
set -g status on
set -g status-justify left
set -g status-left-length 300
set -g status-right-length 300

set -g @catppuccin_status_background 'none'
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_left_separator ' '
set -g @catppuccin_status_right_separator ''

set -g @catppuccin_session_color '#{?client_prefix,#ED7892,#72F6B2}'
set -g @catppuccin_directory_color '#D498F8'
set -g @catppuccin_date_time_color '#55BBF9'
set -g @catppuccin_cpu_color '#FDF796'
set -g @catppuccin_session_text '#S'
set -g @catppuccin_directory_text '#{b:pane_current_path}'
set -g @catppuccin_date_time_text '%H:%M'
set -g @catppuccin_cpu_text '#{l:#{cpu_percentage}}'

# Catppuccin v2 replacement for the removed `@catppuccin_status_fill` option.
set -g @catppuccin_status_session_text_bg '#{@catppuccin_session_color}'
set -g @catppuccin_status_session_text_fg '#{@thm_crust}'
set -g @catppuccin_status_directory_text_bg '#{@catppuccin_directory_color}'
set -g @catppuccin_status_directory_text_fg '#{@thm_crust}'
set -g @catppuccin_status_date_time_text_bg '#{@catppuccin_date_time_color}'
set -g @catppuccin_status_date_time_text_fg '#{@thm_crust}'
set -g @catppuccin_status_cpu_text_bg '#{@catppuccin_cpu_color}'
set -g @catppuccin_status_cpu_text_fg '#{@thm_crust}'

set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text '#[fg=#FEFFFF]#W'
set -g @catppuccin_window_current_text '#[fg=#FEFFFF]#W#{?window_zoomed_flag,(),}#{?pane_in_mode,(󱣱),}'
set -g @catppuccin_window_text_color '#444a73'
set -g @catppuccin_window_number_color '#55BBF9'
set -g @catppuccin_window_current_text_color '#444a73'
set -g @catppuccin_window_current_number_color '#fdf980'

# Custom v2 separators need explicit foreground and background colors.
set -g @catppuccin_window_left_separator '#[fg=#{@catppuccin_window_text_color},bg=default]'
set -g @catppuccin_window_middle_separator '#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}] '
set -g @catppuccin_window_right_separator '#[fg=#{@catppuccin_window_number_color},bg=default]'
set -g @catppuccin_window_current_left_separator '#[fg=#{@catppuccin_window_current_text_color},bg=default]'
set -g @catppuccin_window_current_middle_separator '#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}] '
set -g @catppuccin_window_current_right_separator '#[fg=#{@catppuccin_window_current_number_color},bg=default]'

set -g @catppuccin_pane_color '#{@thm_green}'
set -g @catppuccin_pane_active_border_style 'fg=#00FF9C'
set -g @catppuccin_pane_border_style 'fg=#3d5afe'

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux' # version 2.1.3

# Must follow Catppuccin, which otherwise replaces the copy-mode selection style.
set -g mode-style 'bg=#2d3f76,bold'
set -gF popup-style 'bg=default,fg=#{@thm_fg}'

set -g status-left '#{E:@catppuccin_status_session}#[fg=#{E:@catppuccin_session_color},bg=default] '
set -g status-right '#{E:@catppuccin_status_directory}#[fg=#{E:@catppuccin_directory_color},bg=default]'
set -ag status-right '#{E:@catppuccin_status_date_time}#[fg=#{E:@catppuccin_date_time_color},bg=default]'
set -agF status-right '#{E:@catppuccin_status_cpu}#[fg=#{E:@catppuccin_cpu_color},bg=default] '


# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux'
