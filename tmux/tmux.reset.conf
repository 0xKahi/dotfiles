bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind p previous-window
bind n next-window

bind r run-shell "~/.config/tmux/scripts/tmux-input.sh -l 'rename window' -- tmux rename-window"
bind C-r run-shell "~/.config/tmux/scripts/tmux-input.sh -l 'rename session' -- tmux rename-session"
bind R source-file ~/.config/tmux/tmux.conf
bind C-^ last-window
bind ^W list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client

bind | split-window
bind s split-window -v -l 15 -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window

# bind : command-prompt
bind : run-shell "~/.config/tmux/scripts/tmux-input.sh -l Cmdline -p ' ' -- bash -c 'printf \"%s\n\" \"\$1\" | tmux source-file -' _"

bind * setw synchronize-panes
bind P set pane-border-status
bind q kill-pane
bind x command-prompt "swap-window -t%%"
# bind x run-shell "~/.config/tmux/scripts/tmux-input.sh -l 'swap window' -- tmux swap-window -t"
## swap panes with menu

bind S choose-session
bind T if -F '#{==:#{pane-border-status},top}' 'set -g pane-border-status top-floating' 'set -g pane-border-status top'

# cycle through layouts
bind space select-layout -n

# floating panes: -L/-U target their own left/top borders (negative values shrink) ( { floating }, { not floating } )
bind -r -T prefix , if-shell -F '#{pane_floating_flag}' { resize-pane -L 20 } { resize-pane -L 20 }
bind -r -T prefix . if-shell -F '#{pane_floating_flag}' { resize-pane -L -20 } { resize-pane -R 20 }
bind -r -T prefix = if-shell -F '#{pane_floating_flag}' { resize-pane -U 2 } { resize-pane -U 7 }
bind -r -T prefix - if-shell -F '#{pane_floating_flag}' { resize-pane -U -2 } { resize-pane -D 7 }

bind-key -T copy-mode-vi 'v' send -X begin-selection # Start selecting text with "v"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi MouseDragEnd1Pane # Don't exit copy mode when dragging with mouse

# Ctrl+drag draws a floating pane (tmux 3.8) starting in the current pane's directory
bind -T root C-MouseDrag1Pane  new-pane -M -c "#{pane_current_path}"
bind -T root C-MouseDrag1Empty new-pane -M -c "#{pane_current_path}"

bind -r -T prefix C-h select-pane -t ':.-' 
bind -r -T prefix C-l select-pane -t ':.+' 

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind w display-menu -x C -y C -T " workmux " \
  "sidebar" s "run-shell 'workmux sidebar'" \
  "dashboard" d "popup -d '#{pane_current_path}' -w 80% -h 80% -x C -y C -E 'workmux dashboard'" \
  '' \
  "add" a "run-shell -c '#{pane_current_path}' '~/.config/tmux/scripts/tmux-input.sh -l new_branch -- workmux add'" \
  "add w/branch" b "run-shell -c '#{pane_current_path}' '~/.config/tmux/scripts/workmux-add-from-branch.sh'" \
  "open" o "run-shell -c '#{pane_current_path}' '~/.config/tmux/scripts/workmux-fzf.sh open'" \
  '' \
  "remove" r "run-shell -c '#{pane_current_path}' '~/.config/tmux/scripts/workmux-fzf.sh remove -k --filter is_main=false --multi'" \
  "close" c "run-shell -c '#{pane_current_path}' '~/.config/tmux/scripts/workmux-fzf.sh close --filter is_main=false,is_open=true'" \
  '' \
  "quit" q ""

## tmux actions: nested menus (floating items are greyed out unless the pane is floating)
bind a display-menu -x C -y C -T " tmux actions " \
  "floating" a {
    display-menu -x C -y C -T " floating pane actions" \
      "##{?pane_floating_flag,,-}left" h { run-shell -C "resize-pane -x 40% -y ##{e|-:##{window_height},1}"; move-pane -P centre-left; move-pane -R 2 } \
      "##{?pane_floating_flag,,-}right" l { run-shell -C "resize-pane -x 40% -y ##{e|-:##{window_height},1}"; move-pane -P centre-right; move-pane -L 2 } \
      "##{?pane_floating_flag,,-}top" t { run-shell -C "resize-pane -x ##{e|-:##{window_width},4} -y 40%"; move-pane -P top-centre } \
      "##{?pane_floating_flag,,-}bottom" b { run-shell -C "resize-pane -x ##{e|-:##{window_width},4} -y ##{e|-:##{e|/:##{e|*:##{window_height},40},100},1}"; move-pane -P bottom-centre; move-pane -U 1 } \
      '' \
      "##{?pane_floating_flag,,-}top left" u { resize-pane -x '50%' -y '50%'; move-pane -P top-left } \
      "##{?pane_floating_flag,,-}top right" i { resize-pane -x '50%' -y '50%'; move-pane -P top-right } \
      "##{?pane_floating_flag,,-}bottom left" J { run-shell -C "resize-pane -x 50% -y ##{e|-:##{e|/:##{window_height},2},1}"; move-pane -P bottom-left; move-pane -U 1 } \
      "##{?pane_floating_flag,,-}bottom right" K { run-shell -C "resize-pane -x 50% -y ##{e|-:##{e|/:##{window_height},2},1}"; move-pane -P bottom-right; move-pane -U 1 } \
      '' \
      "##{?pane_floating_flag,,-}center" c { move-pane -P centre } \
      '' \
      "##{?pane_floating_flag,,-}tile vsplit" v { join-pane -h -s '##{pane_id}' -t '{last}' } \
      "##{?pane_floating_flag,,-}tile stacked" s { join-pane -v -s '##{pane_id}' -t '{last}' } \
      '' \
      "##{?pane_floating_flag,,-}collapse" - { run-shell '~/.config/tmux/scripts/float-height.sh collapse' } \
      "##{?pane_floating_flag,,-}expand" e { run-shell '~/.config/tmux/scripts/float-height.sh expand' } \
      "##{?pane_floating_flag,,-}focus" f { run-shell -C "resize-pane -x 80% -y ##{e|-:##{window_height},1}"; move-pane -P centre } \
      '' \
      "quit" q ''
  } \
  '' \
  "go to pane" o { display-panes -d 0 } \
  "swap pane" s { display-panes -d 0 "swap-pane -t '%%'" } \
  "move pane" m { run-shell '~/.config/tmux/scripts/move-pane-to-session.sh' } \
  "new floating pane" n { new-pane -x '70%' -y '70%' -c '#{pane_current_path}'; move-pane -P centre } \
  '' \
  "quit" q ''
